<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff4d4f" />
      <stop offset="65%" stop-color="#cf1322" />
      <stop offset="100%" stop-color="#820014" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="45%" stop-color="#fadb14" />
      <stop offset="100%" stop-color="#d48806" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Móc treo phía trên -->
  <path d="M 32 3 L 32 8" stroke="#fadb14" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="4" r="2.5" fill="none" stroke="#fadb14" stroke-width="2" />

  <!-- Nắp vàng đỉnh đèn lồng -->
  <rect x="23" y="8" width="18" height="4.5" rx="2" fill="url(#gold)" filter="url(#softShadow)" />

  <!-- Thân đèn lồng đỏ oval -->
  <ellipse cx="32" cy="28" rx="20" ry="17" fill="url(#lanternGlow)" filter="url(#softShadow)" />

  <!-- Các đường nan lồng vàng/cam cong mềm mại -->
  <ellipse cx="32" cy="28" rx="13" ry="16.6" fill="none" stroke="#faad14" stroke-width="1.2" opacity="0.85" />
  <ellipse cx="32" cy="28" rx="6.5" ry="16.8" fill="none" stroke="#faad14" stroke-width="1.2" opacity="0.85" />
  <line x1="32" y1="11.5" x2="32" y2="44.5" stroke="#ffe58f" stroke-width="1.5" opacity="0.9" />

  <!-- Đai vàng trang trí giữa bụng đèn -->
  <path d="M 12.2 28 Q 32 31.5 51.8 28" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.9" />

  <!-- Đế vàng chân đèn -->
  <rect x="23" y="44" width="18" height="4.5" rx="2" fill="url(#gold)" filter="url(#softShadow)" />

  <!-- Cụm tua rua vàng Tết đung đưa -->
  <circle cx="32" cy="50.5" r="2" fill="#d48806" />
  <path d="M 30 52 L 28 62 M 32 52 L 32 63 M 34 52 L 36 62" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" />
</svg>
